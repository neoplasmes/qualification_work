inheritedBy:
  tags: css
fileGroups:
  cfg-css:
  - stylelint.config.js
tasks:
  fmt:
    deps:
    - ~:lint-css-fix
  lint-css:
    command: pnpm exec stylelint @files(css)
    inputs:
    - '@group(css)'
    - '@group(cfg-css)'
  lint-css-fix:
    extends: lint-css
    args: --fix
  check:
    deps:
    - ~:lint-css-fix
