inheritedBy:
  tags: node
implicitInputs:
- /package.json
- /pnpm-lock.yaml
- /pnpm-workspace.yaml
- /tsconfig.json
fileGroups:
  test-unit: []
  test-int: []
  test-e2e: []
  css: []
  assets: []
  cfg-code: []
  cfg-fmt:
  - /dprint.jsonc
  - /prettier.config.js
  - /.prettierignore
  - /packages/node/microservice-config/prettier.js
  cfg-lint:
  - /oxlint.config.ts
taskOptions:
  runFromWorkspaceRoot: false
tasks:
  fmt:
    command: dprint fmt @files(src) @files(test-unit) @files(test-int) @files(test-e2e) @files(css) @files(cfg)
      @files(assets)
    inputs:
    - '@group(src)'
    - '@group(test-unit)'
    - '@group(test-int)'
    - '@group(test-e2e)'
    - '@group(cfg-code)'
    - '@group(css)'
    - '@group(assets)'
    - '@group(cfg)'
    - '@group(cfg-fmt)'
    deps:
    - ~:lint-fix
  lint:
    command: pnpm exec oxlint --config $workspaceRoot/oxlint.config.ts --no-error-on-unmatched-pattern @files(src)
      @files(test-unit) @files(test-int) @files(test-e2e) @files(cfg-code)
    inputs: &lint-inputs
    - '@group(src)'
    - '@group(test-unit)'
    - '@group(test-int)'
    - '@group(test-e2e)'
    - '@group(cfg-code)'
    - '@group(cfg)'
    - '@group(cfg-lint)'
  lint-fix:
    command: pnpm exec oxlint --config $workspaceRoot/oxlint.config.ts --no-error-on-unmatched-pattern @files(src)
      @files(test-unit) @files(test-int) @files(test-e2e) @files(cfg-code)
    inputs: *lint-inputs
    args: --fix
  check:
    command: noop
    inputs: []
    deps:
    - ~:fmt
    - ~:lint-fix
