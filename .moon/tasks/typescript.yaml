inheritedBy:
  languages: typescript
tasks:
  typecheck:
    command: pnpm exec tsc --noEmit --project $projectRoot
    inputs:
    - '@group(src)'
    - '@group(test-unit)'
    - '@group(test-int)'
    - '@group(test-e2e)'
    - '@group(cfg-code)'
    - '@group(cfg)'
    - '@group(css)'
  check:
    deps:
    - ~:typecheck
