# Configures all projects within the workspace to create a project graph.
# Accepts a list of globs, a mapping of projects to relative file paths,
# or both values.
projects:
  root: "."
  client: "apps/client"
  server: "apps/server"
  data-service: "apps/data-service"
  auth: "apps/auth"
  primitive-server: "packages/primitive-server"
  types: "packages/types"
  design-system: "packages/design-system"
  eslint-plugin-fsd: "packages/eslint-plugin-fsd"
  microservice-config: "packages/microservice-config"
  microservice-utils: "packages/microservice-utils"
  openresty-discovery: "apps/openresty-discovery"
  e2e-backend: "e2e/backend"
  e2e-frontend: "e2e/frontend"

# moon run command (without :) will run exactly command for default project 
# and thus using root "moon.yml"
defaultProject: "root"

# Configures the version control system (VCS). Also known as
# source code management (SCM).
vcs:
  client: "git"
  # The default branch / base.
  defaultBranch: "main"

  # The upstream version control provider, where the repository
  # source code is stored.
  # @since 1.8.0
  # @values "bitbucket" | "github" | "gitlab" | "other"
  provider: "github"

pipeline:
  installDependencies: false
  syncProjects: true
  syncWorkspace: true

hasher:
  ignoreMissingPatterns:
    - "**/.env"
    - "**/.env.*"

# Docker images: moon docker scaffold copies only moon configs by default (no toolchains
# are configured), so every file pnpm and the build tasks need before sources is listed here.
docker:
  scaffold:
    configsPhaseGlobs:
      - .prototools
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - postcss.config.js
      - stylelint.config.js
      - .browserslistrc
      - packages/design-system/src/theme/theme.css
      - packages/design-system/src/theme/tokens.json
      - apps/*/package.json
      - packages/*/package.json
      # root script used by client:build-assets; client does not depend on the root project
      - tools/build-client/*.nu
