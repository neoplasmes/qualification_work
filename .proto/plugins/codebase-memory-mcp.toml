name = "codebase-memory-mcp"
type = "cli"

[plugin]
description = "Persistent code intelligence MCP server."
homepage-url = "https://github.com/DeusData/codebase-memory-mcp"
repository-url = "https://github.com/DeusData/codebase-memory-mcp"

[install]
download-url = "https://github.com/DeusData/codebase-memory-mcp/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/DeusData/codebase-memory-mcp/releases/download/v{version}/{checksum_file}"

[install.arch]
x86_64 = "amd64"
aarch64 = "arm64"

[install.exes.codebase-memory-mcp]
exe-path = "codebase-memory-mcp"
primary = true

[platform.windows]
archs = ["x64", "arm64"]
download-file = "codebase-memory-mcp-windows-{arch}.zip"
checksum-file = "checksums.txt"

[platform.macos]
archs = ["x64", "arm64"]
download-file = "codebase-memory-mcp-darwin-{arch}.tar.gz"
checksum-file = "checksums.txt"

[platform.linux]
archs = ["x64", "arm64"]
download-file = "codebase-memory-mcp-linux-{arch}.tar.gz"
checksum-file = "checksums.txt"

[resolve]
git-url = "https://github.com/DeusData/codebase-memory-mcp"
version-pattern = '^v?(\d+\.\d+\.\d+)$'
