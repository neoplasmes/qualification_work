name = "kubernetes-mcp-server"
type = "cli"

[plugin]
description = "Kubernetes MCP server."
homepage-url = "https://github.com/containers/kubernetes-mcp-server"
repository-url = "https://github.com/containers/kubernetes-mcp-server"

[platform.linux]
download-file = "kubernetes-mcp-server-linux-{arch}"

[platform.macos]
download-file = "kubernetes-mcp-server-darwin-{arch}"

[platform.windows]
download-file = "kubernetes-mcp-server-windows-{arch}.exe"

[install]
download-url = "https://github.com/containers/kubernetes-mcp-server/releases/download/v{version}/{download_file}"
unpack = false

[install.arch]
aarch64 = "arm64"
x86_64 = "amd64"

[resolve]
git-url = "https://github.com/containers/kubernetes-mcp-server"
version-pattern = '^v?(\d+\.\d+\.\d+)$'
