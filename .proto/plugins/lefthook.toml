name = "lefthook"
type = "cli"

[plugin]
description = "Fast, multilingual Git hook manager."
homepage-url = "https://lefthook.dev/"
repository-url = "https://github.com/evilmartians/lefthook"

[install]
download-url = "https://github.com/evilmartians/lefthook/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/evilmartians/lefthook/releases/download/v{version}/{checksum_file}"
unpack = false

[install.arch]
aarch64 = "arm64"

[platform.linux]
download-file = "lefthook_{version}_Linux_{arch}.gz"
checksum-file = "lefthook_checksums.txt"
exe-path = "lefthook_{version}_Linux_{arch}"

[platform.macos]
download-file = "lefthook_{version}_MacOS_{arch}.gz"
checksum-file = "lefthook_checksums.txt"
exe-path = "lefthook_{version}_MacOS_{arch}"

[platform.windows]
download-file = "lefthook_{version}_Windows_{arch}.gz"
checksum-file = "lefthook_checksums.txt"
exe-path = "lefthook_{version}_Windows_{arch}.exe"

[resolve]
git-url = "https://github.com/evilmartians/lefthook"
