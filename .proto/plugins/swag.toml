name = "swag"
type = "cli"

[install]
download-url = "https://github.com/swaggo/swag/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/swaggo/swag/releases/download/v{version}/{checksum_file}"

[install.exes.swag]
exe-path = "swag"
primary = true

[install.arch]
aarch64 = "arm64"

[platform.linux]
archs = ["x64", "arm64"]
download-file = "swag_{version}_Linux_{arch}.tar.gz"
checksum-file = "checksums.txt"

[platform.macos]
archs = ["x64", "arm64"]
download-file = "swag_{version}_Darwin_{arch}.tar.gz"
checksum-file = "checksums.txt"

[resolve]
git-url = "https://github.com/swaggo/swag"
