services:
  postgres:
    image: postgres:17-alpine
    container_name: auth-test-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: qualification_test
      PGPORT: 5432
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d qualification_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: auth-test-pgbouncer
    volumes:
      - ./test/integration/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./test/integration/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "16432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8.6-alpine
    container_name: auth-test-redis
    command: ["redis-server", "--requirepass", "test_password", "--save", ""]
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "test_password", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  kafka:
    image: apache/kafka:4.2.0
    container_name: auth-test-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL serves containers of this compose, EXTERNAL serves processes on the host
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    ports:
      - "19093:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 40

  auth:
    build:
      context: ../..
      dockerfile: apps/auth/Dockerfile
    container_name: auth-test-service
    env_file:
      - .env.test
    volumes:
      - ./test/integration/keys:/keys:ro
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "13002:3002"

  # this image actually responses with the same headers, cookies and request body,
  # so it's great and very useful for testing, 'cause we exactly wants to check, that
  echo:
    image: traefik/whoami:v1.11
    container_name: auth-test-echo
    command: ["--port", "8080"]

  openresty:
    image: openresty/openresty:1.29.2.3-alpine-fat
    container_name: auth-test-openresty
    volumes:
      - ../../env/k8s/app/gateway/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./test/integration/openresty/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./test/integration/openresty/upstreams.conf:/shared/upstreams.conf:ro
    depends_on:
      - auth
      - echo
    ports:
      - "18080:80"
