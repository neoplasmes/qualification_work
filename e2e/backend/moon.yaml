language: typescript
layer: automation
tags:
  - node
  - e2e
fileGroups:
  src:
    - utils/**/*.ts
    - setup.ts
  test-e2e:
    - scenarios/**/*.ts
  cfg:
    - package.json
    - tsconfig.json
    - vitest.config.ts
  cfg-code:
    - vitest.config.ts
  stack:
    - /e2e/docker-compose/**/*.{yaml,conf,ini,pem,sql}
    - /apps/*/Dockerfile
    - /env/postgres/**/*.sql
    - /env/pgbouncer/*.{ini,txt}
tasks:
  test-e2e:
    command: nu --no-config-file $workspaceRoot/tools/compose-test/compose-test.nu $workspaceRoot/e2e/docker-compose/docker-compose.yaml
      pnpm exec vitest run
    inputs:
      - "@group(src)"
      - "@group(test-e2e)"
      - "@group(cfg)"
      - "@group(stack)"
      - /tools/compose-test/compose-test.nu
      - project: auth
        group: src
      - project: auth
        group: cfg
      - project: server
        group: src
      - project: server
        group: cfg
      - project: data-service
        group: src
      - project: data-service
        group: cfg
      - project: client
        group: src
      - project: client
        group: cfg
      - project: openresty-discovery
        group: src
      - project: openresty-discovery
        group: cfg
      - project: primitive-server
        group: src
      - project: primitive-server
        group: cfg
      - project: types
        group: src
      - project: types
        group: cfg
      - project: microservice-utils
        group: src
      - project: microservice-utils
        group: cfg
      - /tools/microservice-config/*
      - project: client
        group: css
      - project: client
        group: assets
    env:
      NODE_EXTRA_CA_CERTS: $workspaceRoot/e2e/docker-compose/keys/ca.pem
    options:
      mutex: docker-tests
  compose-up:
    command: docker compose -f $workspaceRoot/e2e/docker-compose/docker-compose.yaml up -d --renew-anon-volumes
      --build --wait --wait-timeout 300
    options:
      cache: false
      runInCI: false
  compose-down:
    command: docker compose -f $workspaceRoot/e2e/docker-compose/docker-compose.yaml down -v --rmi local
    options:
      cache: false
      runInCI: false
  compose-logs:
    command: docker compose -f $workspaceRoot/e2e/docker-compose/docker-compose.yaml logs --tail=200
    options:
      cache: false
      runInCI: false
dependsOn:
  - auth
  - server
  - data-service
  - client
  - openresty-discovery
  - primitive-server
  - types
  - microservice-utils
