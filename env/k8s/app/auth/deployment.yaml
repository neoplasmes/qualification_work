apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      # start order: the pod starts only after postgres and kafka are ready,
      # services route only to ready pods, so a successful connect means ready
      initContainers:
        - name: wait-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z -w 2 postgres-postgresql 5432 && nc -z -w 2 kafka 9092; do sleep 2; done
          resources:
            limits:
              memory: "16Mi"
      containers:
        - name: auth
          image: "ghcr.io/neoplasmes/qualification_work/apps_auth:custom"
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
          resources:
            requests:
              memory: "64Mi"
              cpu: "200m"
            limits:
              memory: "192Mi"
              cpu: "500m"
          # migrations, topics and consumer group joins run before the port opens
          startupProbe:
            httpGet:
              path: /health
              port: 3002
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            # every service owns its database, the url is built from the shared credentials
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/auth?sslmode=disable"
            - name: AUTH_JWT_PRIVATE_KEY_PATH
              value: /etc/auth/jwt.private.pem
          envFrom:
            - configMapRef:
                name: app-env-config
            - secretRef:
                name: app-secret
          volumeMounts:
            - name: jwt-key
              mountPath: /etc/auth
              readOnly: true
      volumes:
        - name: jwt-key
          secret:
            secretName: auth-jwt-key
            items:
              - key: jwt.private.pem
                path: jwt.private.pem
