apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-service
  template:
    metadata:
      labels:
        app: data-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      # start order: the pod starts only after postgres and kafka are ready,
      # services route only to ready pods, so a successful connect means ready
      initContainers:
        - name: wait-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z -w 2 postgres-postgresql 5432 && nc -z -w 2 kafka 9092; do sleep 2; done
          resources:
            limits:
              memory: "16Mi"
      containers:
        - name: data-service
          image: "ghcr.io/neoplasmes/qualification_work/apps_data-service:custom"
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
          resources:
            requests:
              memory: "192Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          # migrations, topics and consumer group joins run before the port opens
          startupProbe:
            httpGet:
              path: /health
              port: 3003
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            # every service owns its database, the url is built from the shared credentials
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/data?sslmode=disable"
          envFrom:
            - configMapRef:
                name: app-env-config
            - secretRef:
                name: app-secret
          # pending-merge tmp storage; image creates /tmp/datasets, mount keeps it writable
          volumeMounts:
            - name: merge-tmp
              mountPath: /tmp/datasets
      volumes:
        - name: merge-tmp
          emptyDir: {}
