apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      # start order: the pod starts only after postgres and kafka are ready,
      # services route only to ready pods, so a successful connect means ready
      initContainers:
        - name: wait-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z -w 2 postgres-postgresql 5432 && nc -z -w 2 kafka 9092; do sleep 2; done
          resources:
            limits:
              memory: "16Mi"
      containers:
        - name: server
          image: "ghcr.io/neoplasmes/qualification_work/apps_server:custom"
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          resources:
            requests:
              memory: "128Mi"
              cpu: "500m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          # migrations, topics and consumer group joins run before the port opens
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            # every service owns its database, the url is built from the shared credentials
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/dashboards?sslmode=disable"
          envFrom:
            - configMapRef:
                name: app-env-config
            - secretRef:
                name: app-secret
