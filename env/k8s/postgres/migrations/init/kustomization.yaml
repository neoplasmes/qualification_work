apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: postgres-init-migration-sql
    namespace: app
    # files live outside this dir, so kustomize must be built with --load-restrictor=LoadRestrictionsNone
    files:
      - ../../../../postgres/init/000_databases.sql
resources:
  - job.yaml
