name: local

services:
  redis:
    container_name: redis-local-development
    image: redis:8.6-alpine
    command: [
      "redis-server",
      "--requirepass",
      "dev_password",
      "--appendonly",
      "yes",
    ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  redis-insight:
    container_name: redis-insight-local-development
    image: redis/redisinsight:3.4
    environment:
      - RI_LOG_LEVEL=debug
    ports:
      - "5540:5540"
    depends_on:
      - redis

volumes:
  redis-data:
