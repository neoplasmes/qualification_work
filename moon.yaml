language: unknown
layer: configuration
fileGroups:
  tools-nu:
  - tools/**/*.nu
  cfg-code:
  - oxlint.config.ts
  - prettier.config.js
  fmt:
  - '*.json'
  - '*.jsonc'
  - '*.yaml'
  - '*.md'
  - .moon/**/*.yaml
  - .github/**/*.yaml
  cfg-fmt:
  - dprint.jsonc
  - prettier.config.js
  - .prettierignore
  cfg-lint:
  - oxlint.config.ts
  - package.json
  - pnpm-lock.yaml
tasks:
  setup-tools:
    command: proto install
    options:
      cache: false
      runInCI: false
  setup-hooks:
    command: lefthook install
    deps:
    - root:setup-tools
    options:
      cache: false
      runInCI: false
  setup:
    command: pnpm install --frozen-lockfile
    deps:
    - root:setup-hooks
    options:
      cache: false
      runInCI: false
  install-dependencies:
    command: pnpm install --frozen-lockfile
    preset: utility
    options:
      cache: false
      runInCI: false
  lock:
    command: pnpm install --lockfile-only
    options:
      cache: false
      runInCI: false
  fmt:
    command: dprint fmt @files(fmt) @files(cfg-code)
    inputs:
    - '@group(fmt)'
    - '@group(cfg-code)'
    - '@group(cfg-fmt)'
    deps:
    - root:lint-fix
  lint:
    command: pnpm exec oxlint --config oxlint.config.ts @files(cfg-code)
    inputs:
    - '@group(cfg-code)'
    - '@group(cfg-lint)'
  lint-fix:
    extends: lint
    args: --fix
  lint-nu:
    command: nu --no-config-file tools/nu-check/nu-check.nu @files(tools-nu)
    inputs:
    - '@group(tools-nu)'
  lint-hooks:
    command: lefthook validate
    inputs:
    - lefthook.yaml
  check:
    command: noop
    inputs: []
    deps:
    - root:fmt
    - root:lint-fix
    - root:lint-nu
    - root:lint-hooks
  deploy-to-registry:
    command: nu --no-config-file tools/registry/deploy.nu
    preset: utility
  # todo: universality or delete
  migrate:
    command: nu --no-config-file tools/migrations/apply-migration.nu
    preset: utility
  compose-up:
    command: docker compose -f docker-compose.database.yaml up -d --renew-anon-volumes --build --wait --wait-timeout
      300
    options:
      cache: false
      runInCI: false
  compose-down:
    command: docker compose -f docker-compose.database.yaml down -v --rmi local
    options:
      cache: false
      runInCI: false
  compose-logs:
    command: docker compose -f docker-compose.database.yaml logs --tail=200
    options:
      cache: false
      runInCI: false
  # k3d management for local testing of kubernetes (k3s) (not for weak machines)
  # todo: as project grows, this set of commands should be reconsidered
  cluster-create:
    command: k3d cluster create local-development --config k8s/k3d.config.yaml
    preset: utility
  cluster-run:
    command: k3d cluster start local-development
    preset: utility
  cluster-stop:
    command: k3d cluster stop local-development
    preset: utility
  cluster-delete:
    command: k3d cluster delete local-development
    preset: utility
