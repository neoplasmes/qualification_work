language: unknown
layer: configuration
fileGroups:
  tools-nu:
    - "{tools,env,apps}/**/*.nu"
    - "!**/node_modules/**"
  cfg-code:
    - oxlint.config.ts
    - stylelint.config.js
    - postcss.config.js
    - tools/**/*.{js,ts}
    - "!tools/**/node_modules/**"
  fmt:
    - "*.json"
    - "*.jsonc"
    - "*.yaml"
    - "*.md"
    - .moon/**/*.yaml
    - .github/**/*.yaml
  cfg-fmt:
    - dprint.jsonc
    - biome.json
  cfg-lint:
    - oxlint.config.ts
    - package.json
    - pnpm-lock.yaml
tasks:
  setup-tools:
    command: proto install
    options:
      cache: false
      runInCI: false
  setup-hooks:
    command: lefthook install
    deps:
      - root:setup-tools
    options:
      cache: false
      runInCI: false
  setup:
    command: pnpm install --frozen-lockfile
    deps:
      - root:setup-hooks
    options:
      cache: false
      runInCI: false
  install-dependencies:
    command: pnpm install --frozen-lockfile
    preset: utility
    options:
      cache: false
      runInCI: false
  lock:
    command: pnpm install --lockfile-only
    options:
      cache: false
      runInCI: false
  fmt:
    command: dprint fmt @files(fmt) @files(cfg-code)
    inputs:
      - "@group(fmt)"
      - "@group(cfg-code)"
      - "@group(cfg-fmt)"
    deps:
      - root:lint-fix
  lint:
    command: pnpm exec oxlint --config oxlint.config.ts @files(cfg-code)
    inputs:
      - "@group(cfg-code)"
      - "@group(cfg-lint)"
  lint-fix:
    extends: lint
    args: --fix
  typecheck:
    command: pnpm exec tsc --noEmit --project tools
    inputs:
      - tools/**/*.ts
      - tools/tsconfig.json
      - tsconfig.json
  test-int:
    command: pnpm exec vitest run --config tools/vitest.config.ts
    inputs:
      - tools/agent-hooks/**/*.ts
      - tools/vitest.config.ts
  lint-nu:
    command: nu --no-config-file tools/nu-check/nu-check.nu @files(tools-nu)
    inputs:
      - "@group(tools-nu)"
  lint-hooks:
    command: lefthook validate
    inputs:
      - lefthook.yaml
  check:
    command: noop
    inputs: []
    deps:
      - root:fmt
      - root:lint-fix
      - root:typecheck
      - root:lint-nu
      - root:lint-hooks

# server and data-service depend on the root project; without this the whole
# repository would be copied into their images
docker:
  scaffold:
    sourcesPhaseGlobs:
      - tsconfig.json
