language: typescript
layer: library
tags:
  - node
fileGroups:
  src:
    - src/**/*.ts
    - "!src/**/*.test.ts"
    - "!src/**/*.loadtest.ts"
    - "!src/test-utils/**/*.ts"
    - "!src/**/*.test.int.ts"
  test-unit:
    - src/**/*.test.ts
    - src/test-utils/**/*.ts
    - "!src/**/*.test.int.ts"
  cfg:
    - package.json
    - tsconfig.json
    - vitest.config.ts
  cfg-code:
    - vitest.config.ts
  test-int:
    - src/**/*.test.int.ts
tasks:
  test-unit:
    command: pnpm exec vitest run --exclude '**/*.test.int.ts'
    inputs:
      - "@group(src)"
      - "@group(test-unit)"
      - "@group(cfg)"
  test-int:
    command: pnpm exec vitest run .test.int
    inputs:
      - "@group(src)"
      - "@group(test-int)"
      - "@group(cfg)"
    options:
      mutex: docker-tests

docker:
  scaffold:
    sourcesPhaseGlobs:
      - src/**/*
      - package.json
      - tsconfig.json
