# bench and loadtest remain opt-in; no benchmark suite is defined
language: typescript
layer: library
tags:
- node
fileGroups:
  src:
  - src/**/*.ts
  - '!src/**/*.test.ts'
  - '!src/**/*.loadtest.ts'
  - '!src/test-utils/**/*.ts'
  test-unit:
  - src/**/*.test.ts
  - src/test-utils/**/*.ts
  cfg:
  - package.json
  - tsconfig.json
  - vitest.config.ts
  - tsup.config.ts
  cfg-code:
  - vitest.config.ts
  - tsup.config.ts
  bench:
  - src/**/*.loadtest.ts
tasks:
  test-unit:
    command: pnpm exec vitest run
    inputs:
    - '@group(src)'
    - '@group(test-unit)'
    - '@group(cfg)'
  build:
    command: pnpm exec tsup
    inputs:
    - '@group(src)'
    - '@group(cfg)'
    outputs:
    - dist
  loadtest:
    command: pnpm exec tsx src/Application.loadtest.ts
    preset: utility

docker:
  scaffold:
    sourcesPhaseGlobs:
      - src/**/*
      - package.json
      - tsconfig.json
      - tsup.config.ts
