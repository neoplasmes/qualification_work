packages:
  - 'apps/client'
  - 'apps/data-service'
  - 'apps/server'
  - 'packages/eslint-plugin-fsd'
  - 'packages/microservice-config'
  - 'packages/microservice-utils'
  - 'packages/primitive-server'
  - 'packages/types'
  - 'packages/design-system'
  - 'e2e/backend'
  - 'e2e/frontend'
  - 'generation'
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  argon2: true
  cpu-features: false
  esbuild: true
  msw: true
  protobufjs: false
  ssh2: false

linkWorkspacePackages: true

catalogs:
  common:
    es-toolkit: ^1.47.0
  postgres:
    pg: ^8.20.0
    "@types/pg": ^8.18.0
  backend:
    jsep: ^1.4.0
    redis: ^5.11.0
    zod: ^4.3.6
  devtools:
    dotenv: ^17.3.1
    dotenv-cli: ^11.0.0
    testcontainers: ^12.0.1
    tsup: ^8.5.1
    tsx: ^4.21.0
